# Perfil LOCAL — Usa H2 en memoria (no necesita MySQL instalado)
# Para activar: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local

spring.datasource.url=jdbc:h2:mem:instaclon;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=USER,VALUE,COMMENT,CROSS,FULL,INNER,INTERSECT,NATURAL,PRIMARY,ROWNUM,SELECT,SYSDATE,SYSTIME,SYSTIMESTAMP,TODAY,UNION,WHERE;LOCK_TIMEOUT=30000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=false
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# HikariCP: 1 sola conexión para evitar table lock contention en H2 in-memory
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-init-sql=SET LOCK_TIMEOUT 30000

server.port=8080

# File Upload Limits (aumentar el tamaño permitido por defecto de 1MB a 20MB)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Logs
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
